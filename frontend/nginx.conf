server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same origin instead of CORS: core-api mounts no CORSMiddleware, and it is
    # not this ticket's to touch. The upstream is a constant because core-api
    # always listens on 8000 inside the compose network — ${CORE_API_PORT} only
    # changes the published port.
    location /api/ {
        proxy_pass http://core-api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
