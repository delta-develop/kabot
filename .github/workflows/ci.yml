name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - agent
          - memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --package "${{ matrix.service }}" --group dev
      - working-directory: services/${{ matrix.service }}
        run: uv run --no-sync coverage run -m pytest tests -q
      - working-directory: services/${{ matrix.service }}
        run: uv run --no-sync coverage report -m

  core-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: kabot
          POSTGRES_PASSWORD: kabot123
          POSTGRES_DB: kavak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kabot -d kavak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_INTEGRATION_URL: postgresql+asyncpg://kabot:kabot123@localhost:5432/kavak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --package core-api --group dev
      - working-directory: services/core-api
        run: uv run --no-sync coverage run -m pytest tests -q
      - working-directory: services/core-api
        run: uv run --no-sync coverage report -m

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run --no-sync black --check .
      - run: uv run --no-sync isort --check-only .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg SERVICE=core-api -t elephant-core-api .
