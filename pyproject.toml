[project]
name = "kabot"
version = "0.1.0"
description = "Elephant — B2B multi-store marketplace backend"
requires-python = ">=3.11,<3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/core-api"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "coverage>=7.16.1",
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pre-commit>=4.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
