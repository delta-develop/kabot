[project]
name = "kabot"
version = "0.1.0"
description = "Elephant — B2B multi-store marketplace backend"
requires-python = ">=3.11,<3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/core-api"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "coverage>=7.16.1",
]
