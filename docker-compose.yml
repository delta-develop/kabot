# Named per workspace so two worktrees never share containers or the
# mongo_data/pg_data volumes; PORT_BASE is unique per workspace (see
# .superset/ports.sh) and is the isolation key, not just the published ports.
name: elephant-${PORT_BASE:-8000}

services:
  core-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: core-api
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./services/core-api:/src/services/core-api

  # Same image as core-api, different entrypoint: the worker needs Postgres,
  # Mongo, Redis and the LLM client, which is exactly core-api's dependency set.
  # A separate process rather than a thread, so restarting the API never
  # interrupts a consolidation and the other way round.
  consolidator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: core-api
    command: ["python", "-m", "app.workers.consolidation"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./services/core-api:/src/services/core-api

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: agent
    ports:
      - "${AGENT_PORT:-8001}:8000"
    volumes:
      - ./services/agent:/src/services/agent

  memory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: memory
    ports:
      - "${MEMORY_PORT:-8002}:8000"
    volumes:
      - ./services/memory:/src/services/memory

  # The console is a pure HTTP consumer: nginx serves the built page and proxies
  # /api/ to core-api over the compose network. No env_file — .env carries live
  # OPENAI_API_KEY and TYPESAFE_API_KEY, which have no business in a frontend
  # container.
  console:
    build:
      context: ./frontend
    ports:
      - "${CONSOLE_PORT:-8003}:80"
    depends_on:
      - core-api
    healthcheck:
      # 127.0.0.1, not localhost: `listen 80` binds IPv4 only, and inside the
      # container localhost resolves to ::1 first, so BusyBox wget is refused
      # while the published port answers fine.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:5
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: elephant
      POSTGRES_PASSWORD: elephant123
      POSTGRES_DB: elephant
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elephant -d elephant"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo_data:
  pg_data:
