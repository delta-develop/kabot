[project]
name = "core-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "pymongo>=4.18.1",
    "openai>=3.16.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlmodel>=0.0.42",
    "asyncpg>=0.31.0",
    "twilio>=9.11.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pgvector>=0.5.0",
    "logfire[asyncpg,fastapi,httpx,pymongo,redis]>=5.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
