[project]
name = "core-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "motor>=3.7.1",
    "openai>=3.16.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.42",
    "asyncpg>=0.31.0",
    "twilio>=9.11.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
